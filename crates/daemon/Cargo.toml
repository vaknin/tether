[package]
name = "tether"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tether-core = { path = "../core" }
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
uuid.workspace = true
# FCM wake (src/fcm.rs). All four are already built for iroh; only serde_urlencoded is new.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# App channel manifests (src/apps.rs).
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
